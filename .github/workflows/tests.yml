name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest>=8.0.0 \
            pytest-asyncio>=0.23.0 \
            httpx>=0.27.0 \
            python-dotenv>=1.0.0 \
            chromadb>=0.5.0

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PATREON_ACCESS_TOKEN: pat_ci_test_fake_token_for_unit_tests
        run: pytest tests/ -v --tb=short
